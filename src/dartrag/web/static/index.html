<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DART 공시 분석</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">DART 공시 분석</div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="ask" aria-selected="true">질문하기</button>
      <button role="tab" data-tab="company">회사</button>
      <button role="tab" data-tab="feed">공시 피드</button>
      <button role="tab" data-tab="watch">관심 종목</button>
      <button role="tab" data-tab="diff">변경점</button>
    </nav>
    <div id="account" class="account" hidden>
      <span id="account-email" class="muted"></span>
      <button id="logout" type="button">로그아웃</button>
    </div>
  </header>

  <main>
    <section id="auth-view" class="auth" hidden>
      <form id="auth-form" class="card">
        <h2 id="auth-title">로그인</h2>
        <label for="auth-email">이메일</label>
        <input id="auth-email" type="email" autocomplete="username" required maxlength="254">
        <label for="auth-password">비밀번호</label>
        <input id="auth-password" type="password" autocomplete="current-password" required minlength="10" maxlength="128">
        <p id="auth-hint" class="hint" hidden>비밀번호는 10자 이상으로 정해주세요.</p>
        <div id="auth-error" role="alert"></div>
        <button type="submit" class="primary" id="auth-submit">로그인</button>
        <p class="muted" id="auth-switch-line">
          <span id="auth-switch-text">계정이 없으신가요?</span>
          <button type="button" id="auth-switch" class="link">가입하기</button>
        </p>
      </form>
    </section>

    <section id="tab-ask" class="panel">
      <form id="ask-form" class="card">
        <label for="ask-q">무엇이 궁금하세요?</label>
        <textarea id="ask-q" rows="2" maxlength="500" required
          placeholder="예: 삼성전자 2024년 매출 증가율과 영업이익률은?"></textarea>
        <div class="row">
          <input id="ask-stock" list="company-list" placeholder="회사 (선택)" autocomplete="off">
          <input id="ask-from" type="number" min="2000" max="2100" placeholder="시작 연도">
          <input id="ask-to" type="number" min="2000" max="2100" placeholder="끝 연도">
          <button type="submit" class="primary">질문</button>
        </div>
      </form>
      <div id="ask-result" aria-live="polite"></div>
    </section>

    <section id="tab-company" class="panel" hidden>
      <form id="company-form" class="card row">
        <input id="company-stock" list="company-list" placeholder="회사 이름 또는 종목코드" required autocomplete="off">
        <button type="submit" class="primary">보기</button>
      </form>
      <div id="company-result" aria-live="polite"></div>
    </section>

    <section id="tab-feed" class="panel" hidden>
      <div class="card row">
        <select id="feed-days">
          <option value="1">오늘</option><option value="7" selected>최근 7일</option>
          <option value="30">최근 30일</option>
        </select>
        <select id="feed-imp">
          <option value="3">🔴 중요한 것만</option><option value="2" selected>🟠 이상</option>
          <option value="1">전체</option>
        </select>
        <label class="check"><input id="feed-watched" type="checkbox"> 관심 종목만</label>
        <button id="feed-refresh">새로고침</button>
      </div>
      <ul id="feed-list" class="list"></ul>
    </section>

    <section id="tab-watch" class="panel" hidden>
      <form id="watch-form" class="card row">
        <input id="watch-stock" list="company-list" placeholder="회사 이름 또는 종목코드" required autocomplete="off">
        <select id="watch-imp">
          <option value="3">🔴 중요한 공시만</option><option value="2" selected>🟠 이상 알림</option>
          <option value="1">모든 공시</option>
        </select>
        <button type="submit" class="primary">추가</button>
      </form>
      <ul id="watch-list" class="list"></ul>
      <p class="hint">알림은 <code>dartrag feed poll --every 600</code> 이 켜져 있을 때 보내집니다.</p>
    </section>

    <section id="tab-diff" class="panel" hidden>
      <form id="diff-form" class="card row">
        <input id="diff-stock" list="company-list" placeholder="회사" required autocomplete="off">
        <button type="submit" class="primary">최근 두 사업보고서 비교</button>
      </form>
      <div id="diff-result"></div>
    </section>
  </main>

  <datalist id="company-list"></datalist>
  <footer>공시 정보 요약이며 투자 권유가 아닙니다. 데이터 출처: 금융감독원 OpenDART</footer>
  <div id="chart-tip" class="chart-tip" role="status" hidden></div>
  <template id="tpl-error"><div class="card error" role="alert"></div></template>
  <script src="/static/chart.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
