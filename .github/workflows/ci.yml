name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dartrag
          POSTGRES_PASSWORD: dartrag
          POSTGRES_DB: dartrag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dartrag -d dartrag_test"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dartrag:dartrag@localhost:5432/dartrag_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
