name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dartrag
          POSTGRES_PASSWORD: dartrag
          POSTGRES_DB: dartrag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dartrag -d dartrag_test"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dartrag:dartrag@localhost:5432/dartrag_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      # 잠금 파일(requirements/dev.txt)의 버전·해시 그대로 설치한다
      - run: pip install --no-deps --require-hashes -r requirements/dev.txt
      - run: pip install --no-deps -e . && pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # 프롬프트·모델을 바꾸면 실제 평가 결과(eval/baseline.json)도 함께 올려야 통과
      - run: dartrag eval ci-check

  # 알려진 취약점이 있는 의존성 검사 (잠금 파일 기준)
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      # PyPI 취약점 정보에는 심각도가 없어, 알려진 취약점이 하나라도 있으면 실패한다
      - name: Python 의존성 (pip-audit)
        run: |
          pip-audit --strict --disable-pip --require-hashes -r requirements/runtime.txt -r requirements/dev.txt
          pip-audit --strict --disable-pip --no-deps -r requirements/torch.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # 배포물에 들어가는 패키지만 보고, high·critical 이 있으면 실패
      - name: 웹 화면 의존성 (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
      - run: terraform fmt -check -recursive
      # AWS 자격 증명 없이 문법과 참조만 검사(원격 상태와 실제 AWS에는 접속하지 않음)
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # 브라우저 종단 테스트: 실제 FastAPI(가짜 검색·언어 모델) + Postgres + next start 를 Chromium 으로
  # 가입 → 로그인 → 질문 → 내 데이터 내려받기 → 탈퇴, 로그인 뒤 돌아갈 주소 검사
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dartrag
          POSTGRES_PASSWORD: dartrag
          POSTGRES_DB: dartrag_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dartrag -d dartrag_e2e"
          --health-interval 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://dartrag:dartrag@localhost:5432/dartrag_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --no-deps --require-hashes -r requirements/dev.txt
      - run: pip install --no-deps -e . && pip check
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # /api 를 테스트용 백엔드(8765)로 넘기도록 빌드
      - run: npm run build
        working-directory: frontend
        env:
          API_ORIGIN: http://127.0.0.1:8765
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # 배포 이미지가 빌드되는지, 배포용 compose·Caddyfile 이 올바른지 확인 (이미지는 올리지 않음)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: 배포 compose 검사
        run: |
          cp infra/prod/.env.example infra/prod/.env
          docker compose -f infra/prod/docker-compose.yml --profile monitoring --profile ollama config --quiet
      - name: Caddyfile 검사
        run: docker compose -f infra/prod/docker-compose.yml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
      - name: 백엔드 이미지
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: dartrag-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: 웹 화면 이미지
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: dartrag-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # 운영 서버(Oracle Cloud Ampere A1)와 같은 linux/arm64 에서 에뮬레이션 없이 이미지를 만들고 띄워 본다
  # (이미지는 올리지 않음). 빌드 캐시 범위는 x86 docker 작업과 겹치지 않게 -arm64 를 붙인다
  docker-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: 백엔드 이미지 (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: dartrag-backend:arm64
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,scope=backend-arm64,mode=max
      # CPU 전용 PyTorch(aarch64)와 C 확장 패키지(psycopg, lxml 등)가 실제로 불러와지는지
      - name: 백엔드 실행 확인
        run: |
          docker run --rm dartrag-backend:arm64 python -c "
          import platform, psycopg, torch, sentence_transformers
          import dartrag, dartrag.web.app, dartrag.worker.celery_app
          assert platform.machine() == 'aarch64', platform.machine()
          assert torch.version.cuda is None, 'CUDA 판 PyTorch 가 설치됨'
          assert psycopg.pq.__impl__ == 'binary', psycopg.pq.__impl__
          x = torch.ones(2, 2)
          print(platform.machine(), 'torch', torch.__version__, (x @ x).sum().item())
          "
          docker run --rm dartrag-backend:arm64 dartrag --help
      - name: 웹 화면 이미지 (arm64)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/arm64
          load: true
          tags: dartrag-frontend:arm64
          cache-from: type=gha,scope=frontend-arm64
          cache-to: type=gha,scope=frontend-arm64,mode=max
      - name: 웹 화면 실행 확인
        run: |
          docker run -d --name web -p 127.0.0.1:3000:3000 dartrag-frontend:arm64
          for i in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:3000/ && break; sleep 1; done
          curl -fsS -o /dev/null -w "GET / -> %{http_code}\n" http://127.0.0.1:3000/
          docker rm -f web
      - name: OpenSearch 이미지 (arm64)
        uses: docker/build-push-action@v7
        with:
          context: infra/opensearch
          platforms: linux/arm64
          load: true
          tags: dartrag-opensearch:arm64
          cache-from: type=gha,scope=opensearch-arm64
          cache-to: type=gha,scope=opensearch-arm64,mode=max
      # 배포 compose 와 같은 설정으로 띄워 nori 한국어 형태소 분석기가 동작하는지 (띄어쓰기 단위보다 잘게 나뉘어야 함)
      - name: OpenSearch 실행 확인
        run: |
          docker run -d --name os -p 127.0.0.1:9200:9200 \
            -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true \
            -e DISABLE_INSTALL_DEMO_CONFIG=true -e OPENSEARCH_JAVA_OPTS="-Xms512m -Xmx512m" \
            dartrag-opensearch:arm64
          for i in $(seq 90); do curl -fs -o /dev/null http://127.0.0.1:9200/_cluster/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:9200/_cat/plugins
          curl -fsS -H "Content-Type: application/json" http://127.0.0.1:9200/_analyze \
            -d '{"tokenizer": "nori_tokenizer", "text": "삼성전자의 사업보고서"}' \
            | python3 -c "import json, sys; t = [x['token'] for x in json.load(sys.stdin)['tokens']]; print(t); assert len(t) > 2, t"
          docker rm -f os
      - name: 실패 시 컨테이너 로그
        if: failure()
        run: |
          docker logs web || true
          docker logs os || true
