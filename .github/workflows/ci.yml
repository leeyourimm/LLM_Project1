name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dartrag
          POSTGRES_PASSWORD: dartrag
          POSTGRES_DB: dartrag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dartrag -d dartrag_test"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dartrag:dartrag@localhost:5432/dartrag_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # 프롬프트·모델을 바꾸면 실제 평가 결과(eval/baseline.json)도 함께 올려야 통과
      - run: dartrag eval ci-check

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
      - run: terraform fmt -check -recursive
      # AWS 자격 증명 없이 문법과 참조만 검사(원격 상태와 실제 AWS에는 접속하지 않음)
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
