name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dartrag
          POSTGRES_PASSWORD: dartrag
          POSTGRES_DB: dartrag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dartrag -d dartrag_test"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://dartrag:dartrag@localhost:5432/dartrag_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # 프롬프트·모델을 바꾸면 실제 평가 결과(eval/baseline.json)도 함께 올려야 통과
      - run: dartrag eval ci-check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # 배포 이미지가 빌드되는지, 배포용 compose·Caddyfile 이 올바른지 확인 (이미지는 올리지 않음)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 배포 compose 검사
        run: |
          cp infra/prod/.env.example infra/prod/.env
          docker compose -f infra/prod/docker-compose.yml --profile monitoring --profile ollama config --quiet
      - name: Caddyfile 검사
        run: docker compose -f infra/prod/docker-compose.yml run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
      - name: 백엔드 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dartrag-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: 웹 화면 이미지
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: dartrag-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
