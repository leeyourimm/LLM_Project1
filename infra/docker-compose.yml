# 로컬 개발용 인프라
# 기본: Postgres, Redis (0단계 수집에 필요한 것)
# --profile search: Qdrant, OpenSearch(nori) (1단계 검색부터 사용)
name: dartrag

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dartrag
      POSTGRES_PASSWORD: dartrag
      POSTGRES_DB: dartrag
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dartrag"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.2
    profiles: [search]
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]

  opensearch:
    build: ./opensearch
    profiles: [search]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ["9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata:
  qdrantdata:
  osdata:
