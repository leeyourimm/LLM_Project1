[project]
name = "dartrag"
version = "0.1.0"
description = "DART 공시 분석 서비스"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.2",
  "boto3>=1.34",
  "lxml>=5.2",
  "typer>=0.12",
  "qdrant-client>=1.19",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
dartrag = "dartrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dartrag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# 테스트용 로컬(:memory:) Qdrant 는 페이로드 인덱스를 무시한다는 경고
filterwarnings = ["ignore:Payload indexes have no effect"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
