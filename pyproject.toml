[project]
name = "dartrag"
version = "0.1.0"
description = "DART 공시 분석 서비스"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary]>=3.2",
  "boto3>=1.34",
  "lxml>=5.2",
  "typer>=0.12",
  "qdrant-client>=1.19",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "redis>=5.0",
  "reportlab>=4.2",
  "celery[redis]>=5.4",
  "prometheus-client>=0.20",
  # 웹 푸시 내용 암호화(RFC 8291)와 VAPID 서명(RFC 8292), 2단계 인증 비밀값 암호화
  "cryptography>=44",
  # 2단계 인증 등록용 QR 코드 (순수 파이썬, 의존성 없음)
  "segno>=1.6",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
# 오류 수집 (SENTRY_DSN 을 넣을 때만 씀)
ops = ["sentry-sdk[fastapi,celery]>=2.10"]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5", "fakeredis>=2.23", "sentry-sdk>=2.10"]

[project.scripts]
dartrag = "dartrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dartrag"]

# DB 스키마를 패키지에 함께 넣는다. 배포 이미지는 저장소 없이 설치한 패키지로 돌아서,
# 이것이 없으면 api 가 시작할 때 새 마이그레이션을 적용하지 못한다 (db/repository.py)
[tool.hatch.build.targets.wheel.force-include]
"infra/db" = "dartrag/db/schema"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# 테스트용 로컬(:memory:) Qdrant 는 페이로드 인덱스를 무시한다는 경고
filterwarnings = ["ignore:Payload indexes have no effect"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
